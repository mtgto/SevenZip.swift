name: Swift

on:
  push:
    branches: [ main ]
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - '.github/workflows/swift.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - '.github/workflows/swift.yml'

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
